[project]
name = "terch"
version = "0.1.2"
description = "Modular CLI search engine with rich UI and interactive navigation"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Shreyas Deb" }
]
dependencies = [
    "beautifulsoup4>=4.12.0",
    "inquirerpy>=0.3.4",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "rich>=13.7.0",
]

[project.scripts]
search = "search_cli.main:main"
terch = "search_cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["search_cli"]