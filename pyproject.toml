[project]
name = "terch"
version = "0.4.0"
description = "Modular CLI meta-search tool with a full-screen TUI"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Shreyas Deb" }
]
dependencies = [
    "beautifulsoup4>=4.12.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "rich>=13.7.0",
    "textual>=8.2.8",
    "tomli>=2.0.1; python_version < '3.11'",
]

[project.scripts]
search = "search_cli.main:main"
terch = "search_cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["search_cli"]
